name: CI

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

permissions:
    contents: read

env:
    WRANGLER_SEND_METRICS: 'false'

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        concurrency:
            group: verify-${{ github.ref }}
            cancel-in-progress: ${{ github.event_name == 'pull_request' }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Verify vendored web-ml tarball checksum
              run: cd vendor/web-ml && sha256sum -c web-ml-0.2.0.tgz.sha256

            - name: Install Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Check formatting of changed files
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: |
                  if [ -n "$BASE" ] && ! printf '%s' "$BASE" | grep -Eq '^0+$'; then
                    git diff --name-only --diff-filter=ACMR -z "$BASE" HEAD -- '*.ts' '*.mjs' '*.js' '*.json' '*.jsonc' '*.md' '*.css' '*.html' '*.yml' '*.yaml' | xargs -0 -r bun run format:check
                  fi

            - name: Run TSDoc lint
              run: bun run lint

            - name: Install Playwright browsers for mockup and story checks
              run: bunx playwright install --with-deps chromium firefox webkit

            - name: Run typecheck and unit tests
              run: bun run check

            - name: Validate Cloudflare Workers bundle (dry run)
              run: bun run deploy:dry-run

            - name: Run Storybook interaction tests
              run: bun run test:stories

    e2e:
        name: E2E (${{ matrix.project }})
        needs:
            - verify
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        concurrency:
            group: e2e-${{ github.ref }}-${{ matrix.project }}
            cancel-in-progress: ${{ github.event_name == 'pull_request' }}
        strategy:
            fail-fast: false
            matrix:
                project:
                    - chromium
                    - firefox
                    - webkit
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Verify vendored web-ml tarball checksum
              run: cd vendor/web-ml && sha256sum -c web-ml-0.2.0.tgz.sha256

            - name: Install Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Install Playwright browser
              env:
                  PROJECT: ${{ matrix.project }}
              run: bunx playwright install --with-deps "$PROJECT"

            - name: Run E2E suite
              env:
                  PROJECT: ${{ matrix.project }}
                  SAMATA_SKIP_KNOWN_FAILURES: '1'
              run: bun run test:e2e --project="$PROJECT"

    deploy:
        name: Deploy (beta.samata.ml)
        needs:
            - verify
            - e2e
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        environment: cloudflare-beta
        concurrency:
            group: cloudflare-deploy-main
            cancel-in-progress: false
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Verify vendored web-ml tarball checksum
              run: cd vendor/web-ml && sha256sum -c web-ml-0.2.0.tgz.sha256

            - name: Install Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Deploy beta build to Cloudflare Workers
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  BETA_TELEMETRY_ENABLED: 'true'
                  SAMATA_CRAWLER_POLICY: closed
              run: bun run deploy
