name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Install Playwright browsers for story and mockup checks
              run: bunx playwright install --with-deps chromium firefox webkit

            - name: Run TSDoc lint
              run: bun run lint

            - name: Run typecheck and unit tests
              run: bun run check

            - name: Build production assets
              run: bun run build

            - name: Run Storybook interaction tests
              run: bun run test:stories

            - name: Validate Cloudflare Workers bundle (dry run)
              run: bun run deploy:dry-run

    e2e:
        name: E2E (${{ matrix.project }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                project:
                    - chromium
                    - firefox
                    - webkit
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Install Playwright browser
              run: bunx playwright install --with-deps ${{ matrix.project }}

            - name: Run E2E suite
              env:
                  SAMATA_SKIP_KNOWN_FAILURES: '1'
              run: bun run test:e2e --project=${{ matrix.project }}

            - name: Upload Playwright test results on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-results-${{ matrix.project }}
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore

    deploy:
        name: Deploy (beta.samata.ml)
        needs:
            - verify
            - e2e
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: cloudflare-beta
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Deploy beta build to Cloudflare Workers
              env:
                  BETA_TELEMETRY_ENABLED: 'true'
                  SAMATA_CRAWLER_POLICY: closed
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: bun run deploy
