<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="100%" style="max-width: 380px; height: auto;" role="img" aria-labelledby="act-tanh-title act-tanh-desc">
  <title id="act-tanh-title">Tanh activation function graph</title>
  <desc id="act-tanh-desc">A smooth S-shaped curve centered at the origin, flattening near -1 for negative inputs, passing through 0 at an input of 0, and flattening near +1 for positive inputs.</desc>

  <rect x="1" y="1" width="378" height="228" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Reference bounds -->
  <line x1="70" y1="36" x2="330" y2="36" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="70" y1="176" x2="330" y2="176" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Axes -->
  <line x1="70" y1="106" x2="330" y2="106" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="200" y1="36" x2="200" y2="176" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Curve: tanh(x) for x in [-4, 4] -->
  <polyline fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
    points="70.0,176.0 102.5,175.7 135.0,173.5 151.3,169.4 167.5,159.3 183.8,138.3 200.0,106.0 216.3,73.7 232.5,52.7 248.8,42.6 265.0,38.5 297.5,36.3 330.0,36.0"/>

  <!-- Axis Labels -->
  <text x="200" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">Output</text>
  <text x="200" y="216" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">Input (raw score)</text>

  <!-- Y Ticks -->
  <text x="62" y="40" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">+1</text>
  <text x="62" y="110" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">0</text>
  <text x="62" y="180" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">-1</text>

  <!-- X Ticks -->
  <text x="70" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">-4</text>
  <text x="200" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">0</text>
  <text x="330" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">+4</text>
</svg>