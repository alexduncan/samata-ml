<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="100%" style="max-width: 380px; height: auto;" role="img" aria-labelledby="act-relu-title act-relu-desc">
  <title id="act-relu-title">ReLU activation function graph</title>
  <desc id="act-relu-desc">A line that stays flat at 0 for all negative inputs, then bends sharply upward at 0 and rises linearly for all positive inputs.</desc>

  <rect x="1" y="1" width="378" height="228" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Gridlines -->
  <line x1="70" y1="36" x2="330" y2="36" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="70" y1="106" x2="330" y2="106" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Axes -->
  <line x1="70" y1="176" x2="330" y2="176" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="200" y1="36" x2="200" y2="176" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Curve: max(0, x) -->
  <polyline fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
    points="70,176 200,176 330,36"/>

  <!-- Helpful annotations -->
  <text x="135" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Switched off (0)</text>
  <text x="278" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Passes through</text>

  <!-- Axis Labels -->
  <text x="200" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">Output</text>
  <text x="200" y="216" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">Input (raw score)</text>

  <!-- Y Ticks -->
  <text x="62" y="40" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">+4</text>
  <text x="62" y="110" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">+2</text>
  <text x="62" y="180" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">0</text>

  <!-- X Ticks -->
  <text x="70" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">-4</text>
  <text x="200" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">0</text>
  <text x="330" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">+4</text>
</svg>