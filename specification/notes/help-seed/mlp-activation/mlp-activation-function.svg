<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" width="100%" style="max-width: 680px; height: auto;" role="img" aria-labelledby="mlp-neuron-title mlp-neuron-desc">
  <title id="mlp-neuron-title">Where the activation function fits inside a hidden-layer neuron</title>
  <desc id="mlp-neuron-desc">Diagram showing three inputs multiplied by weights entering Step 1 (Weighted Sum), producing a raw score that enters Step 2 (Activation Function), which reshapes the signal and sends the output to the next layer.</desc>
  <defs>
    <marker id="mlp-arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="mlp-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="678" height="208" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="340" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Inside a Single Hidden-Layer Neuron</text>

  <!-- Inputs -->
  <rect x="24" y="52" width="104" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="76" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Input 1</text>

  <rect x="24" y="96" width="104" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="76" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Input 2</text>

  <rect x="24" y="140" width="104" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="76" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Input 3</text>

  <!-- Weighted connections -->
  <line x1="128" y1="66" x2="194" y2="96" stroke="#64748b" stroke-width="1.5" marker-end="url(#mlp-arrow-gray)"/>
  <line x1="128" y1="110" x2="194" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#mlp-arrow-gray)"/>
  <line x1="128" y1="154" x2="194" y2="124" stroke="#64748b" stroke-width="1.5" marker-end="url(#mlp-arrow-gray)"/>
  <text x="162" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">x weights</text>

  <!-- Step 1: Weighted Sum -->
  <rect x="200" y="66" width="134" height="88" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="267" y="86" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">STEP 1</text>
  <text x="267" y="106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Weighted Sum</text>
  <text x="267" y="124" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Combines inputs</text>
  <text x="267" y="139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">into one raw score</text>

  <!-- Arrow Step 1 to Step 2 -->
  <line x1="334" y1="110" x2="394" y2="110" stroke="#64748b" stroke-width="1.8" marker-end="url(#mlp-arrow-gray)"/>
  <text x="364" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Raw score</text>

  <!-- Step 2: Activation Function -->
  <rect x="400" y="54" width="162" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="481" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">STEP 2</text>
  <text x="481" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Activation Function</text>
  <text x="481" y="113" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e40af">Bends, caps, or filters</text>
  <text x="481" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e40af">the signal</text>
  <path d="M 455 152 L 478 152 L 505 136" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Output arrow -->
  <line x1="562" y1="110" x2="606" y2="110" stroke="#2563eb" stroke-width="2" marker-end="url(#mlp-arrow-blue)"/>
  <text x="642" y="102" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Output</text>
  <text x="642" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">to next</text>
  <text x="642" y="131" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">layer</text>

  <text x="340" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">The chosen activation function applies to every neuron in the network's hidden layers.</text>
</svg>